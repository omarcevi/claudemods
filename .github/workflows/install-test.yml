name: Install test
on:
  schedule:
    - cron: "5 8 * * 1" # Mondays 08:05 UTC, after the plugin sync
  pull_request:
    paths: ["data/**", ".claude-plugin/**", "scripts/verify-installs.sh"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Install every marketplace plugin into a throwaway config
        run: ./scripts/verify-installs.sh
