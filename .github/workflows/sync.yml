name: Sync pinned plugins
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: node scripts/sync.mjs --summary "$RUNNER_TEMP/sync-summary.md"
      # A bump can break the rules (e.g. a plugin starts fetching code at runtime). Still open the
      # PR so the reviewer sees why: the summary marks it with ⛔. Bot PRs don't trigger CI, so
      # read the summary before merging.
      - run: node scripts/build.mjs || echo "::warning::build.mjs failed; see the PR summary"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: bot/sync
          commit-message: Bump pinned plugin commits
          title: Bump pinned plugin commits
          body-path: ${{ runner.temp }}/sync-summary.md
