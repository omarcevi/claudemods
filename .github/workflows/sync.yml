name: Sync pinned plugins
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync.mjs
      - run: node scripts/build.mjs
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: bot/sync
          commit-message: Bump pinned plugin commits
          title: Bump pinned plugin commits
          body: |
            Upstream mods and plugins changed. Review each diff in `data/resolved.json`
            (every `sha` links to a commit you can compare) before merging.
