name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Data is valid and generated files are up to date
        run: node scripts/build.mjs --check
      - name: Marketplace passes Claude Code validation
        run: npx -y @anthropic-ai/claude-code plugin validate .
